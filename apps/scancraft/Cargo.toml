[package]
name = "scancraft"
description = "ScanCraft desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
scancraft-core = { workspace = true }
scancraft-engine = { workspace = true }
scancraft-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { workspace = true }
craft-menu = { workspace = true }
craft-dialogs = { workspace = true }
craft-quit = { workspace = true }
chrono = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
scancraft-apple = { workspace = true }
