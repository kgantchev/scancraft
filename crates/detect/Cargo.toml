[package]
name = "scancraft-detect"
description = "ScanCraft page detection (A5–A7, A9, A10), curved sides (A25), text lines (A26) and book spreads (A30)"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
scancraft-core = { workspace = true }
scancraft-geom = { workspace = true }
scancraft-raster = { workspace = true }
imageproc = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
scancraft-synth = { workspace = true }
# The SmartDoc gate's frames are JPEG. The workspace declares `image` with its png feature; this
# adds the jpeg one for the tests only, and the library itself keeps the smaller set.
image = { workspace = true, features = ["jpeg"] }
# Writes the results and the report beside the dataset.
serde_json = { workspace = true }
