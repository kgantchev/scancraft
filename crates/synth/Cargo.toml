[package]
name = "scancraft-synth"
description = "ScanCraft's synthetic scenes and evaluation metrics (specification §10); never shipped in the app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

# Only scancraft-core: the generator has its own camera and sheet code, so it checks the pipeline
# independently (`cargo xtask layers` forbids scancraft-geom and the pipeline crates here).
[dependencies]
scancraft-core = { workspace = true }
image = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
craft-jpeg = { workspace = true }
craft-image-codecs = { workspace = true }
sha2 = { workspace = true }
